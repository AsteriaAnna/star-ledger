function render(){refreshState();document.body.dataset.mode=mode;$('modeA').textContent=name('a');$('modeB').textContent=name('b');document.querySelectorAll('[data-mode][role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===mode?'true':'false'));document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));const titles={overview:mode==='shared'?'双方存款':'收支概览',ledger:'账单明细',accounts:'账户与归属',review:'转账与核对',import:'导入账单',settings:'设置与同步'};const subs={overview:mode==='shared'?'存放在一起，归属各自清晰。':'让每一笔花费，都有清晰的去处。',ledger:'每一笔记录，都可以回看与修正。',accounts:'钱属于谁、放在哪里，一眼看清。',review:'确认资金去向，让余额与真实生活对齐。',import:'在电脑整理明细，在手机随手记录。',settings:'两个人的账本，按自己的方式保管。'};$('title').innerHTML=E(titles[view])+' <span>✧</span>';$('crumb').textContent=titles[view];$('subtitle').textContent=subs[view];$('eyebrow').textContent=mode==='shared'?'TWO ORBITS, ONE VIEW':mode==='a'?'YOUR MONEY, YOUR ORBIT':'ANOTHER ORBIT, SAME SKY';$('quickTransfer').textContent=mode==='shared'?'⇄ 存入 / 取出':'⇄ 转账 / 存取';$('addEntry').disabled=demo;$('quickTransfer').disabled=demo;
const p=Ledger.project(state);$('reviewBadge').textContent=p.issues.length+state.conflicts.length||'';const remoteIds=new Set(syncInfo?.ids||[]),pending=data.ops.filter(o=>!remoteIds.has(o.id)&&o.actor!=='system').length;$('syncBtn').textContent=demo?'示例账本':Store.isSyncing()?'↻ 正在同步…':connectionInfo?(!syncInfo?'○ 尚未同步':pending?`↑ ${pending} 项待同步`:`✓ 已同步${Store.isUnlocked()?'':' · 已锁定'}`):'○ 本地账本 · 未连接';$('banners').innerHTML=(demo?'<div class="banner">正在体验示例，数据不会写入你的账本。<button class="link" data-act="exit-demo">返回真实账本 →</button></div>':'')+(!ready?'<div class="banner warn">无法打开本地存储，请使用 Edge / Chrome / Safari 普通窗口。保存功能暂不可用。</div>':'')+(state.conflicts.length?`<div class="banner warn">${state.conflicts.length} 项同时修改等待确认，相关记录暂不计入余额。<button class="link" data-nav="review">处理冲突 →</button></div>`:'')+(p.issues.length&&view==='overview'?`<div class="banner warn">${p.issues.length} 项资金记录需要核对，当前余额为暂算值。<button class="link" data-nav="review">去核对 →</button></div>`:'');

function monthToolbar(){return `<div class="toolbar"><div class="month-picker"><button data-act="prev-month" aria-label="上个月">‹</button><input type="month" id="monthInput" value="${month}" aria-label="统计月份"><button data-act="next-month" aria-label="下个月">›</button></div><label class="period-select">统计周期<select id="periodMode" aria-label="统计周期">${opt('week','周度',periodMode)+opt('month','月度',periodMode)+opt('year','年度',periodMode)}</select></label><span class="subtle">${mode==='shared'?'按资金所有权分别统计':'消费按订单日期归属，已抵扣关联退款'}</span></div>`;}
function stat(label,value,foot,featured=false){const [a,b]=money(value).split('.');return `<div class="stat ${featured?'featured':''}"><div class="stat-label">${label}<span>✧</span></div><div class="stat-value">¥ ${a}<small>.${b}</small></div><div class="stat-foot">${foot}</div>${featured?'<span class="spark" aria-hidden="true">✧</span>':''}</div>`;}
function periodWindow(){const y=Number(month.slice(0,4)),m=Number(month.slice(5,7));if(periodMode==='year')return {start:`${y}-01-01 00:00:00`,end:`${y}-12-31 23:59:59`,group:'week',label:`${y} 年`};if(periodMode==='week'){const d=new Date(y,m-1,1),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);const e=new Date(d);e.setDate(e.getDate()+6);const f=x=>x.toISOString().slice(0,10);return {start:f(d)+' 00:00:00',end:f(e)+' 23:59:59',group:'day',label:`${f(d)} 至 ${f(e)}`};}return {start:`${month}-01 00:00:00`,end:`${month}-31 23:59:59`,group:'day',label:`${month} 月`};}
function overviewStats(){const w=periodWindow();return {...Ledger.statisticsRange(state,mode,w.start,w.end,w.group),period:w};}
function trendChart(series,group){const entries=Object.entries(series).sort((a,b)=>a[0].localeCompare(b[0]));if(!entries.length)return empty('还没有消费','导入账单或记下第一笔消费。');const max=Math.max(100, ...entries.map(([,n])=>n));const W=Math.max(620,entries.length*72),H=250,pad={l:58,r:24,t:26,b:46},X=i=>pad.l+i*(W-pad.l-pad.r)/Math.max(1,entries.length-1),Y=n=>H-pad.b-(n/max)*(H-pad.t-pad.b);let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${group==='week'?'年度每周':'周期'}支出趋势">`;for(let i=0;i<4;i++){const n=max*i/3;svg+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${Y(n)}" y2="${Y(n)}" stroke="var(--muted)" opacity=".17" stroke-dasharray="3 6"/><text x="4" y="${Y(n)+4}" font-size="12" fill="var(--muted)">¥${money(Math.round(n))}</text>`;}const path=entries.map(([k,n],i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(n).toFixed(1)).join(' ');svg+=`<path class="trace" d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>`;entries.forEach(([k,n],i)=>{const label=group==='week'?k.slice(5):k.slice(5);svg+=`<g><circle cx="${X(i)}" cy="${Y(n)}" r="3.5" fill="var(--accent)"><title>${k}：¥${money(n)}</title></circle><text x="${X(i)}" y="${Y(n)-10}" text-anchor="middle" font-size="11" fill="var(--text)">¥${money(n)}</text><text x="${X(i)}" y="${H-16}" text-anchor="middle" font-size="11" fill="var(--muted)">${E(label)}</text></g>`;});svg+='</svg>';return `<div class="chart chart-scroll">${svg}</div>`;}
function renderOverview(){if(mode==='shared'){renderSavings();return;}const s=overviewStats(),p=Ledger.project(state),o=p.owned[mode],label=periodMode==='year'?'年度':periodMode==='week'?s.period.label:'本月';const trend=trendChart(s.series,periodMode==='year'?'week':'day');$('content').innerHTML=monthToolbar()+`<div class="stats">${stat(label+'实际支出',s.expense,`${s.rows.filter(t=>t.kind==='expense').length} 笔消费 · 退款后净额`,true)}${stat(label+'收入',s.income,'内部转账与借还款不计，赠与单独计入')}${stat('个人净资产',o.net,`存款 ¥${money(o.savings)} · 欠款 ¥${money(o.owed)}`)}</div><div class="panels">${panel('支出轨迹',trend+`<div class="chart-foot"><span>${E(s.period.label)} · 每个点直接显示金额</span><span>平均 ¥${money(Math.round(s.expense/Math.max(1,Object.keys(s.series).length)))}</span></div>`,`<span class="subtle">${periodMode==='year'?'按周':'按日'}净消费</span>`)}${panel('钱花在哪儿',categoryChart(s.cats,s.expense),'<span class="subtle">金额与占比同时显示</span>')}</div>${panel('最近账单',table(s.rows.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6)),`<button class="link" data-act="all-month">查看全部 ↗</button>`)}${active(state.account).length?'':`<div class="note">开始前先添加账户与当前余额；历史账单也可以导入，未指定账户的记录会进入待核对。 <button class="link" data-act="new-account">添加第一个账户 →</button></div>`}`;}
function daysDivisor(){const [y,m]=month.split('-').map(Number);return month===monthNow()?new Date().getDate():new Date(y,m,0).getDate();}
function lineChart(values,kind='expense',second=null){const [y,m]=month.split('-').map(Number),days=new Date(y,m,0).getDate();const vals=Array.from({length:days},(_,i)=>values[`${month}-${String(i+1).padStart(2,'0')}`]||0),vals2=second?Array.from({length:days},(_,i)=>second[`${month}-${String(i+1).padStart(2,'0')}`]||0):[];const min=Math.min(0,...vals,...vals2),max=Math.max(10000,...vals,...vals2);const X=i=>48+i/(days-1)*550,Y=n=>170-(n-min)/(max-min)*150;let svg='<svg viewBox="0 0 620 210" role="img" aria-label="'+(kind==='expense'?'每日净消费':'每日存款余额')+'"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".2"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>';
for(let i=0;i<4;i++){const n=min+(max-min)*i/3;svg+=`<line x1="48" x2="598" y1="${Y(n)}" y2="${Y(n)}" stroke="var(--muted)" opacity=".17" stroke-dasharray="3 6"/><text x="0" y="${Y(n)+4}" font-size="12" fill="var(--muted)">${Math.abs(n)>=1000000?(n/1000000).toFixed(1)+'万':Math.round(n/100)}</text>`;}
const draw=(v,color,click)=>{const path=v.map((n,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(n).toFixed(1)).join(' ');let str=`<path class="trace" d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>`;v.forEach((n,i)=>str+=`<circle ${click?`data-day="${month}-${String(i+1).padStart(2,'0')}" tabindex="0" role="button" aria-label="${i+1}日消费 ${money(n)} 元"`:''} cx="${X(i)}" cy="${Y(n)}" r="${n?3:1.5}" fill="${color}"><title>${i+1}日：¥${money(n)}</title></circle>`);return str;};svg+=draw(vals,second?'#96dfbb':'var(--accent)',kind==='expense');if(second)svg+=draw(vals2,'#c0a6ee',false);for(let i=0;i<days;i++)if(i===0||i===days-1||(i+1)%5===0)svg+=`<text x="${X(i)}" y="202" text-anchor="middle" font-size="12" fill="var(--muted)">${i+1}日</text>`;svg+='</svg>';return `<div class="chart">${svg}${vals.every(v=>v===0)&&vals2.every(v=>v===0)?'<div class="chart-empty">这个月的星轨，等待第一笔记录</div>':''}</div>`;}
function categoryChart(cats,total){let entries=Object.entries(cats).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);let start=0;const gradient=entries.map(([id,n],i)=>{const from=start;start+=n/total*100;return `${state.category[id]?.color||palette[i%palette.length]} ${from}% ${start}%`;}).join(',');return `<div class="category-content"><div class="donut" ${total?`style="background:conic-gradient(${gradient})"`:''}><div class="donut-label">支出类别<strong>${entries.length||'—'}</strong></div></div><div class="category-list">${entries.length?entries.slice(0,5).map(([id,n],i)=>`<button class="cat-row" data-category="${E(id)}"><span><i style="background:${state.category[id]?.color||palette[i%palette.length]}"></i>${E(state.category[id]?.name||'未分类')}</span><span>${(n/total*100).toFixed(1)}%<small class="subtle"> ¥${money(n)}</small></span></button>`).join(''):'<span class="muted">让花费找到自己的位置。</span>'}${entries.length>5?`<button class="link" data-act="all-month">查看其他 ${entries.length-5} 类 →</button>`:''}</div></div>`;}
function payerLabel(t){return t.payerType==='family-card'?'妈妈亲情卡代付':t.payerType==='huabei-history'?'历史花呗':aname(t.account);}
function table(rows){if(!rows.length)return empty('这里还没有账单','记下今天的一笔，或导入微信、支付宝账单。',`<div><button class="btn" data-nav="import">导入账单 ↥</button></div>`);return `<div class="table-scroll"><table><thead><tr><th>交易 / 备注</th><th>分类与标签</th><th>账户 / 归属</th><th>时间</th><th class="amount">金额</th></tr></thead><tbody>${rows.map(t=>{const net=t.kind==='expense'?Ledger.netExpense(t,state):t.amount;return `<tr><td><div class="merchant"><span>${t.kind==='transfer'?'⇄':t.kind==='income'?'↙':t.kind==='refund'?'↶':'◇'}</span><div><button data-edit-tx="${E(t.id)}">${E(t.merchant||purposeNames[t.purpose]||kindNames[t.kind])}</button><small title="${E(t.note||'')}">${E(t.note||t.raw?.source||'手动记录')}</small></div></div></td><td>${t.pending?'<span class="chip pending">待确认</span>':t.linkedRole==='transfer-leg'?'<span class="chip">转账关联明细</span>':`<span class="subtle">${E(t.kind==='transfer'?purposeNames[t.purpose]:state.category[t.category]?.name||kindNames[t.kind])}</span>`}<small>${(t.tags||[]).map(id=>E(state.tag[id]?.name||'已删除标签')).join(' · ')}${t.payerType?` · ${E(payerLabel(t))}`:''}</small></td><td><span class="subtle">${E(payerLabel(t))}</span><small>${E(name(t.owner))} · ${bucketName(t.bucket)}${t.kind==='transfer'?' → '+E(aname(t.toAccount)):''}</small></td><td><span class="subtle">${E(t.date.slice(0,10))}</span><small>${E(t.date.slice(11,16))}</small></td><td class="amount ${['income','refund'].includes(t.kind)?'income':t.kind==='transfer'?'transfer':''}">${t.kind==='expense'?'−':t.kind==='income'?'+':''} ¥${money(net)}${t.kind==='expense'&&net<t.amount?`<small>${net===0?'已全额退款':'原金额 ¥'+money(t.amount)}</small>`:''}${t.linkedRole?'<small>不重复计算</small>':''}</td></tr>`;}).join('')}</tbody></table></div>`;}
function ledgerRows(){return active(state.tx).filter(t=>(t.owner===ownerMode()||t.kind==='transfer'&&t.purpose==='gift'&&t.toOwner===ownerMode())&&(!filter.search||(t.merchant+' '+t.note+' '+(t.raw?.orderId||'')).toLowerCase().includes(filter.search.toLowerCase()))&&(!filter.kind||t.kind===filter.kind)&&(!filter.category||t.category===filter.category)&&(!filter.tag||t.tags.includes(filter.tag))&&(!filter.month||t.date.startsWith(filter.month))&&(!filter.day||t.date.startsWith(filter.day))&&(!filter.pending||t.pending)).sort((a,b)=>b.date.localeCompare(a.date));}
function renderLedger(){const rows=ledgerRows(),pages=Math.max(1,Math.ceil(rows.length/20));page=Math.min(page,pages);$('content').innerHTML=`<div class="filters"><input id="search" type="search" placeholder="搜索商户、备注或订单号" value="${E(filter.search)}" aria-label="搜索账单"><select id="kindFilter" aria-label="收支类型">${opt('','全部类型',filter.kind)+Object.entries(kindNames).map(([k,n])=>opt(k,n,filter.kind)).join('')}</select><select id="categoryFilter" aria-label="分类">${opt('','全部分类',filter.category)+active(state.category).map(c=>opt(c.id,c.name,filter.category)).join('')}</select><select id="tagFilter" aria-label="标签">${opt('','全部标签',filter.tag)+active(state.tag).map(c=>opt(c.id,c.name,filter.tag)).join('')}</select><input id="ledgerMonth" type="month" aria-label="月份" value="${filter.month}"><button class="link" data-act="reset-filter">重置</button></div>${filter.day?`<div class="note">正在查看 ${filter.day} 的账单。</div>`:''}${panel('全部账单 · '+rows.length+' 笔',table(rows.slice((page-1)*20,page*20))+`<div class="pagination"><button class="btn small" data-act="prev-page" ${page===1?'disabled':''}>上一页</button><span>${page} / ${pages}</span><button class="btn small" data-act="next-page" ${page===pages?'disabled':''}>下一页</button></div>`,`<button class="link" data-act="export-csv">导出筛选结果 ↓</button>`)}`;}
function renderSavings(){const p=Ledger.project(state),cur=p.owned;const series={a:{},b:{}};const [y,m]=month.split('-').map(Number),days=new Date(y,m,0).getDate();for(let i=1;i<=days;i++){const d=month+'-'+String(i).padStart(2,'0'),at=Ledger.project(state,d+' 23:59:59');series.a[d]=at.owned.a.savings;series.b[d]=at.owned.b.savings;}
const saveRows=p.valid.filter(t=>t.bucket==='savings'||t.kind==='transfer'&&t.toBucket==='savings').sort((a,b)=>b.date.localeCompare(a.date));const cards=['a','b'].map(o=>{const deposits=p.valid.filter(t=>t.kind==='transfer'&&t.toOwner===o&&t.toBucket==='savings'&&(t.bucket!=='savings'||t.owner!==o)).reduce((s,t)=>s+t.amount,0);const opening=active(state.account).reduce((s,a)=>s+a.opening[o].savings,0);return `<div class="person-saving ${o}"><h2>${E(name(o))}的存款</h2><div class="stat-value">¥ ${money(cur[o].savings)}</div><div class="subtle">初始存款 ¥${money(opening)} · 后续累计存入 ¥${money(deposits)}</div></div>`;}).join('');const allocations=active(state.account).flatMap(a=>['a','b'].filter(o=>p.balances[a.id][o].savings!==0).map(o=>`<div class="list-row"><div><span class="dot ${o==='a'?'green':'purple'}"></span> ${E(name(o))}的存款<p>${E(a.name)} · ${E(name(a.holder))}保管</p></div><strong>¥ ${money(p.balances[a.id][o].savings)}</strong></div>`)).join('');$('content').innerHTML=monthToolbar()+`<div class="savings-totals">${cards}</div><div class="panels">${panel('存款轨迹',lineChart(series.a,'savings',series.b)+`<div class="chart-foot"><span><i class="dot green"></i> ${E(name('a'))}</span><span><i class="dot purple"></i> ${E(name('b'))}</span></div>`,'<span class="subtle">每日存款余额</span>')}${panel('钱存在哪里',allocations||empty('还没有存款','通过“存入 / 取出”标记自己的存款。'),`<span class="subtle">合计 ¥${money(cur.a.savings+cur.b.savings)}</span>`)}</div>${panel('存入、取出与代管记录',table(saveRows.filter(t=>t.date.startsWith(month)).slice(0,30)))}<div class="note">双方存款为各自资金的合并展示，不改变所有权；已包含在个人资产中，不能重复相加。累计存入按记录累计，再次存回会再次计入。</div>`;}
function renderAccounts(){const p=Ledger.project(state);const ac=active(state.account);$('content').innerHTML=`<div class="toolbar"><span class="muted">卡内余额由资金归属组成，不等于持卡人的全部资产。</span><button class="btn primary" data-act="new-account">＋ 添加账户</button></div><div class="account-grid">${ac.map(a=>{const bal=p.balances[a.id],parts=[['a','savings'],['a','liquid'],['b','savings'],['b','liquid']],total=parts.reduce((s,[o,b])=>s+bal[o][b],0),colors=['#96dfbb','#588c78','#c0a6ee','#7b679a'];return `<section class="account-card"><div class="account-title"><h2>${E(a.name)}</h2><button class="link" data-account="${E(a.id)}">编辑 ↗</button></div><div class="subtle" style="margin-top:8px">${E(a.type)} · ${E(name(a.holder))}保管</div><div class="account-total">¥ ${money(total)}</div><div class="allocation-bar">${parts.map(([o,b],i)=>`<span style="width:${total>0?Math.max(0,bal[o][b])/total*100:25}%;background:${colors[i]}"></span>`).join('')}</div>${parts.map(([o,b],i)=>`<div class="allocation-row"><span><i class="dot" style="background:${colors[i]}"></i> ${E(name(o))} · ${bucketName(b)}</span><strong>¥ ${money(bal[o][b])}</strong></div>`).join('')}<div class="subtle" style="margin-top:17px">${a.balanceBasis==='current'?'当前余额基准':'历史起点余额'} · ${a.asOf}</div></section>`;}).join('')||empty('添加你的第一个账户','支持微信余额、支付宝余额、多张银行卡和现金。')}</div><div class="note">${['a','b'].map(o=>`${E(name(o))}：欠款 ¥${money(p.owned[o].owed)} · 应收 ¥${money(p.owned[o].claim)}`).join('<br>')}</div><div class="section-title"><h2>欠款与应收</h2><button class="btn" data-act="new-debt">＋ 手动录入</button></div>${panel('借款记录',active(state.debt).map(d=>`<div class="list-row"><div>${E(d.name)}<p>${E(name(d.owner))} · ${d.side==='owed'?'我欠别人':'别人欠我'} · ${E(d.counterparty||'未填写对方')}</p></div><div>¥ ${money(p.debtBalances[d.id])} <button class="link" data-debt="${E(d.id)}">编辑</button></div></div>`).join('')||empty('暂无手动欠款','可填写初始欠款，再通过记账中的借入、还款等更新。'))}<div class="note">双方借款通过转账用途“借给对方 / 归还对方借款”记录。个人净资产＝现金及账户资金＋应收－欠款。当前余额基准会忽略此前导入流水，之后新增记录才会 function renderReview(){const p=Ledger.project(state),pairs=Ledger.candidates(state);const conflicts=state.conflicts.map(c=>`<section class="review-card"><h3>同时修改 · ${E(c.heads[0]?.value.merchant||c.heads[0]?.value.name||c.key)}</h3><p>双方从同一版本修改了这条记录，请查看并选择；旧版本保留在历史中。</p><button class="btn" data-conflict="${E(c.key)}">查看 ${c.heads.length} 个版本</button></section>`).join('');const pending=active(state.tx).filter(t=>t.pending);const refunds=active(state.tx).filter(t=>t.kind==='refund'&&!t.linkedTo);$('content').innerHTML=`${conflicts?'<div class="section-title"><h2>修改冲突</h2></div>'+conflicts:''}<div class="section-title"><h2>疑似内部转账 · ${pairs.length} 组</h2><span class="subtle">等额 · 两日内 · 不同账户 · 含转账线索</span></div>${pairs.map((p,i)=>`<section class="review-card"><div class="review-pair"><div>${E(p.out.merchant)} · ${E(aname(p.out.account))}<small>${E(p.out.date)} · ${E(name(p.out.owner))}</small></div><span>⇄ ¥${money(p.out.amount)}</span><div>${E(p.inc.merchant)} · ${E(aname(p.inc.account))}<small>${E(p.inc.date)} · ${E(name(p.inc.owner))}</small></div></div><div class="modal-actions"><button class="btn" data-pair="${i}">核对并合并转账</button></div></section>`).join('')||panel('暂无匹配建议',empty('没有需要合并的转账','只有一端明细时，也可编辑该账单，指定转入账户。'))}<div class="section-title"><h2>待关联退款 · ${refunds.length} 笔</h2></div>${refunds.length?panel('选择对应的原消费',refunds.map(r=>`<div class="list-row"><div>${E(r.merchant)} · ¥${money(r.amount)}<p>${E(r.date)} · ${E(r.raw?.orderId||'')}</p></div><button class="btn small" data-refund="${E(r.id)}">关联消费</button></div>`).join('')):''}<div class="section-title"><h2>待确认账单 · ${pending.length} 笔</h2></div>${pending.length?panel('可多选后批量处理；单笔点击可继续编辑',pendingTable(pending.slice(0,100))):'<div class="note">当前没有待确认账单。</div>'}<div class="section-title"><h2>余额核对提示</h2></div>${panel('需要留意',p.issues.map(i=>`<div class="list-row"><span class="muted">${E(i.reason)}</span>${i.id.startsWith('account:')?`<button class="link" data-account="${E(i.id.slice(8))}">核对账户</button>`:i.id===' function renderImport(){const owner=ownerMode();$('content').innerHTML=`<div class="import-grid">${panel('把账单带进来',`<div class="panel-body"><div class="form-grid"><label>这是谁的原始账单<select id="importOwner">${ownerOptions(owner)}</select></label><label>未识别支付方式的默认账户<select id="importAccount">${accountOptions('')}</select></label></div><label class="dropzone" id="dropzone"><input id="billFile" type="file" accept=".csv,.xlsx,.txt"><span>↥</span><strong>选择或拖入微信 / 支付宝账单</strong><small>CSV / XLSX · 最大 30 MB · 在本机解析</small></label><p class="subtle">银行卡支付需匹配到实际银行卡，不能统一当作微信或支付宝余额。</p><div id="importResult">${importBatch?previewImport():''}</div></div>`,'<span class="chip">预览后写入</span>')}${panel('导入时会发生什么',`<div class="panel-body guide"><ol><li><strong>识别原始订单与付款方式</strong><br>支持标准微信、支付宝文件；压缩包先解压。</li><li><strong>确认账户对应关系</strong><br>已确认的支付方式映射会记住；不确定的可留作待核对。</li><li><strong>跳过重复订单，保留手动修改</strong><br>相同订单不会覆盖已编辑内容或回收站记录。</li><li><strong>单独处理转账与退款</strong><br>疑似转账进入核对页；退款需关联原消费后入账。</li></ol><div class="note">账单会影响对应账户起始日期之后的余额。没有账户或用途不明的记录先暂存，不计入金额。旧版 JSON 备份可在设置中迁移。</div></div>`)}</div>`;}

async function parseBill(file){if(demo)throw Error('示例模式不导入真实文件');if(!file)return;if(ioBusy)throw Error('正在读取文件，请稍候');if(file.size>30*1024*1024)throw Error('请分月导出，单个文件不超过 30 MB');ioBusy=true;const owner=$('importOwner').value,def=$('importAccount').value;$('importResult').innerHTML='<div class="note">正在本地解析账单…</div>';try{const buf=await file.arrayBuffer();let parsed;if(/\.xlsx$/i.test(file.name)){const sheets=await readXLSX(buf);for(const rows of sheets)try{parsed=importRows(rows,file.name);break;}catch{}if(!parsed)throw Error('没有识别到标准账单工作表');}else if(/\.(csv|txt)$/i.test(file.name)){let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch{text=new TextDecoder('gb18030').decode(buf);}parsed=importRows(parseCSV(text),file.name);}else throw Error('请选择 CSV 或 XLSX 文件，ZIP 请先解压');const methods=[...new Set(parsed.records.map(r=>r.payment||''))],mapping={};for(const method of methods){const rule=active(state.rule).find(r=>r.ruleType==='payment'&&r.owner===owner&&r.source===parsed.source&&r.method===method);mapping[method]=rule&&state.account[rule.account]&&!state.account[rule.account].deleted?rule.account:def;}
const seen=new Set(data.ops.filter(o=>o.type==='tx').flatMap(o=>[o.entity,...(o.value.importKeys||[])]));let duplicates=0;const fresh=[];for(const r of parsed.records){const rawKey=`${owner}|${r.source}|${r.orderId&&r.orderId!=='/'?'order:'+r.orderId+'|'+r.type:r.id}`;const id='import:'+rawKey;if(seen.has(id)){duplicates++;continue;}seen.add(id);const cat=active(state.category).find(c=>c.name===r.category)?.id||'';let refund=0;if(r.type==='expense'&&/已全额退款|全额退款成功/.test(r.status))refund=r.amount;const partial=r.status.match(/(?:已退款|退款成功|部分退款)[（(￥¥\s]*(\d+(?:\.\d{1,2})?)/);if(partial&&r.type==='expense')refund=Math.min(r.amount,toCents(partial[1])||0);const transferHint=/转账|提现|充值/.test(r.raw.kind);const externalPayer=r.payerType||'';const external=externalPayer==='family-card'||externalPayer==='huabei-history';fresh.push({id,owner,kind:r.type,date:r.date,amount:r.amount,account:external?'':(mapping[r.payment||'']||''),bucket:'liquid',toAccount:'',toOwner:owner,toBucket:'liquid',purpose:'internal',category:cat,tags:[],merchant:r.merchant,note:r.note,refund,refundDate:'',refundAccount:'',payerType:externalPayer,fee:r.fee||0,pending:!external&&(transferHint||r.type==='neutral'||r.type==='refund'||!mapping[r.payment||'']),pendingReason:transferHint?(r.fee?`疑似提现，手续费 ¥${money(r.fee)}，到账约 ¥${money(Math.max(0,r.amount-r.fee))}；请确认账户及资金用途`:'疑似转账，请确认账户及资金用途'):r.type==='refund'?'请关联原消费':externalPayer==='family-card'?'妈妈亲情卡代付，不影响本人余额':externalPayer==='huabei-history'?'历史花呗消费／还款，不影响当前余额':'请核对账户和收支类型',raw:{...r.raw,source:r.source,orderId:r.orderId,status:r.status,payment:r.payment,originalOrder:r.originalOrder},importKeys:[id],importedAt:new Date().toISOString()});}
importBatch={filename:file.name,parsed,owner,methods,mapping,fresh,duplicates};$('importResult').innerHTML=previewImport();}catch(e){$('importResult').innerHTML=`<div class="note error">${E(e.message)}</div>`;}finally{ioBusy=false;if($('billFile'))$('billFile').value='';}}
async function importNow(){if(!importBatch)return;const b=importBatch;document.querySelectorAll('[data-map]').forEach(el=>b.mapping[b.methods[+el.dataset.map]]=el.value);const changes=[];for(const t of b.fresh){if(state.heads['tx:'+t.id]?.length)continue;const account=t.payerType?'':(b.mapping[t.raw.payment||'']||'');const external=!!t.payerType;changes.push({type:'tx',id:t.id,value:{...t,account,pending:!external&&(!account||/转账|提现|充值/.test(t.raw.kind)||['neutral','refund'].includes(t.kind))}});}for(const method of b.methods){if(!b.mapping[method])continue;const old=active(state.rule).find(r=>r.ruleType==='payment'&&r.owner===b.owner&&r.source===b.parsed.source&&r.method===method);changes.push({type:'rule',id:old?.id||Ledger.uuid(),value:{ruleType:'payment',owner:b.owner,source:b.parsed.source,method,account:b.mapping[method]}});}await saveBatch(changes);importBatch=null;await applyAutoRules();view='review';render();toast('导入完成，待确认项已集中到核对页面');}

function txNeighbors(id,direction){const rows=ledgerRows(),i=rows.findIndex(x=>x.id===id);if(i<0)return null;return rows[i+(direction==='prev'?-1:1)]?.id||null;}
function txForm(id,preset={}){assertEditable();const old=state.tx[id];if(old?.linkedRole==='transfer-leg'){modal('已关联的转账明细',`<div class="note">这条原始明细已合并到另一笔转账，不重复计入金额。请编辑主转账，或解除关联后重新核对。</div><pre class="raw">${E(JSON.stringify(old.raw,null,2))}</pre><div class="modal-actions"><button class="btn" data-edit-tx="${E(old.linkedTo)}">打开主转账</button><button class="btn danger" data-unlink="${E(old.id)}">解除关联</button></div>`);return;}const t={id:id||Ledger.uuid(),owner:ownerMode(),kind:'expense',date:localNow(),amount:0,account:'',bucket:'liquid',toAccount:'',toOwner:ownerMode(),toBucket:'liquid',purpose:'internal',category:'',tags:[],merchant:'',note:'',refund:0,refundDate:'',refundAccount:'',pending:false,...old,...preset};const tags=new Set(t.tags);modal(old?'账单详情':'记一笔',`<form id="txForm"><div class="form-grid"><label>类型<select name="kind" id="txKind">${Object.entries(kindNames).map(([k,n])=>opt(k,n,t.kind)).join('')}</select></label><label>金额（元）<input name="amount" type="number" step="0.01" min="0.01" max="999999999" required value="${t.amount?(t.amount/100).toFixed(2):''}" placeholder="0.00"></label><label>资金属于谁<select name="owner">${ownerOptions(t.owner)}</select></label><label>交易时间<input name="date" type="datetime-local" step="1" required value="${t.date.replace(' ','T')}"></label><label>付款 / 入账账户<select name="account">${accountOptions(t.account)}</select></label><label>使用哪部分资金<select name="bucket">${opt('liquid','流动资金（默认）',t.bucket)+opt('savings','存款',t.bucket)}</select></label><div class="full form-grid" id="transferFields"><label>资金用途<select name="purpose" id="txPurpose">${Object.entries(purposeNames).map(([k,n])=>opt(k,n,t.purpose)).join('')}</select></label><label>转入账户<select name="toAccount">${accountOptions(t.toAccount)}</select></label><label>转入后属于谁<select name="toOwner">${ownerOptions(t.toOwner)}</select></label><label>转入哪部分<select name="toBucket">${opt('liquid','流动资金',t.toBucket)+opt('savings','存款',t.toBucket)}</select></label><div class="note full" style="margin:0">代管、存取款、代买：资金所有权不变。只有赠与、借款或还款允许变更资金所有人。同卡转为存款时，转入和转出选同一账户。</div></div><label class="full" id="debtField">对应欠款 / 应收<select name="debtId">${opt('','请选择',t.debtId)+active(state.debt).map(d=>opt(d.id,`${name(d.owner)} · ${d.name} · ${d.side==='owed'?'欠款':'应收'}`,t.debtId)).join('')}</select></label><label>分类<select name="category">${categoryOptions(t.category)}</select></label><label>交易对方 / 名称<input name="merchant" maxlength="200" value="${E(t.merchant)}"></label><div class="full"><label class="field">标签（可多选）</label><div class="tag-list" style="margin-top:8px">${active(state.tag).map(tag=>`<button type="button" class="tag-toggle ${tags.has(tag.id)?'selected':''}" data-form-tag="${E(tag.id)}">${E(tag.name)}</button>`).join('')}</div></div><label class="full">备注<textarea name="note" maxlength="10000">${E(t.note)}</textarea></label><div class="full form-grid" id="refundFields"><label>已确认退款总额（元）<input name="refund" type="number" step="0.01" min="0" value="${(t.refund/100).toFixed(2)}"></label><label>退款入账时间<input name="refundDate" type="datetime-local" step="1" value="${(t.refundDate||'').replace(' ','T')}"></label><label class="full">退款入账账户（留空按原账户）<select name="refundAccount">${accountOptions(t.refundAccount)}</select></label><p class="subtle full">填写退款总额可抵扣消费；退款入账时间决定余额在哪天增加。已有独立退款关联时，以关联流水为准，不重复加钱。</p></div><label class="full check-row"><input name="pending" type="checkbox" ${t.pending?'checked':''}>暂存为待核对，不计入金额</label></div><div id="txError" class="form-error"></div><div class="modal-actions">${old?`<button class="btn danger" type="button" id="deleteTx">移入回收站</button><button class="btn" type="button" id="historyTx">修改历史</button>`:''}${old?'<button class="btn" type="submit" name="nav" value="prev">保存并上一条</button><button class="btn" type="submit" name="nav" value="next">保存并下一条</button>':''}<button class="btn primary" type="submit">保存账单</button></div></form>${old?.raw?`<details style="margin-top:20px"><summary class="muted">查看原始导入记录</summary><pre class="raw">${E(JSON.stringify(old.raw,null,2))}</pre></details>`:''}`);
const form=$('txForm');const adjust=()=>{$('transferFields').classList.toggle('hidden',form.kind.value!=='transfer');$('debtField').classList.toggle('hidden',!['borrow','repay','lend','collect'].includes(form.kind.value));$('refundFields').classList.toggle('hidden',form.kind.value!=='expense');};adjust();$('txKind').onchange=adjust;$('txPurpose').onchange=()=>{const p=form.purpose.value;if(!['gift','loan','loan-repay'].includes(p))form.toOwner.value=form.owner.value;if(p==='deposit')form.toBucket.value='savings';if(['withdraw','purchase'].includes(p))form.toBucket.value='liquid';};document.querySelectorAll('[data-form-tag]').forEach(b=>b.onclick=()=>{const id=b.dataset.formTag;tags.has(id)?tags.delete(id):tags.add(id);b.classList.toggle('selected',tags.has(id));});if(old){$('deleteTx').onclick=()=>confirm('移入回收站？','原始记录和修改历史保留，之后可恢复。有关联记录时也需要重新核对。',async()=>{await save('tx',t.id,{...old,deleted:true});closeModal();toast('已移入回收站');});$('historyTx').onclick=()=>showHistory('tx',t.id);}
form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;try{const values=Object.fromEntries(new FormData(form)),nav=values.nav||'',amount=toCents(values.amount),refund=Number(values.refund)===0?0:toCents(values.refund),date=normalizeDate(values.date);const value={...t,...values,amount,date,refund:refund||0,refundDate:values.refundDate?normalizeDate(values.refundDate):'',tags:[...tags],pending:form.pending.checked,deleted:false};if(value.kind==='transfer'&&!['gift','loan','loan-repay'].includes(value.purpose))value.toOwner=value.owner;if(value.kind==='transfer'&&value.account===value.toAccount&&value.owner===value.toOwner&&value.bucket===value.toBucket)throw Error('转出与转入完全相同，不会发生资金变化');if(value.kind==='refund'&&!value.linkedTo&&!value.pending)throw Error('退款请先在核对页关联原消费');Ledger.validateEntity('tx',value);const temp=structuredClone(state);temp.tx[t.id]=value;const p=Ledger.project(temp);const ownIssues=p.issues.filter(i=>i.id===t.id);if(!value.pending&&ownIssues.some(i=>!/退款时间未确认/.test(i.reason)))throw Error(ownIssues[0].reason+'；也可勾选待核对后暂存');if(!value.pending&&['expense','transfer','lend','repay'].includes(value.kind)){const before=Ledger.project(state).balances[value.account]?.[value.owner]?.[value.bucket]||0,after=p.balances[value.account]?.[value.owner]?.[value.bucket];if(after<0&&after<before)throw Error('所选资金不足。请核对初始余额、先转为流动资金，或勾选待核对暂存。不会自动动用对方资金。');}if(old?.pairedId&&value.kind!=='transfer')throw Error('请先在关联的转入明细中解除转账关联，再修改类型');if(old?.pairedId&&value.amount!==old.amount)throw Error('合并转账的金额与原始两端绑定，请先解除关联再修改');await save('tx',t.id,value);closeModal();const next=old&&nav?txNeighbors(t.id,nav):null;if(next){txForm(next);toast('已保存，继续编辑下一条');}else toast('账单已保存');}catch(err){$('txError').textContent=err.message;}finally{button.disabled=false;}};}
function accountForm(id){assertEditable();const a=state.account[id]||{id:Ledger.uuid(),name:'',holder:ownerMode(),type:'银行卡',asOf:localNow().slice(0,10),balanceBasis:'current',opening:{a:{liquid:0,savings:0},b:{liquid:0,savings:0}}};modal(id?'编辑账户与初始余额':'添加账户',`<form id="accountForm"><div class="form-grid"><label>账户名称<input name="name" maxlength="100" required value="${E(a.name)}" placeholder="例如：招商银行 · 尾号 1234"></label><label>账户类型<select name="type">${['微信余额','支付宝余额','银行卡','现金'].map(k=>opt(k,k,a.type)).join('')}</select></label><label>账户由谁保管<select name="holder">${ownerOptions(a.holder)}</select></label><label>余额基准日期<input type="date" name="asOf" required value="${a.asOf}"></label><label>余额填写方式<select name="balanceBasis">${opt('current','当前余额（推荐）',a.balanceBasis||'current')+opt('historical','历史起点余额',a.balanceBasis||'current')}</select></label>${['a','b'].flatMap(o=>['liquid','savings'].map(b=>`<label>${E(name(o))}的${bucketName(b)}（元）<input name="${o}_${b}" type="number" min="0" max="999999999" step="0.01" required value="${(a.opening[o][b]/100).toFixed(2)}"></label>`)).join('')}</div><div class="note">“当前余额”会把截至这一天的历史流水作为已包含处理，之后新增流水才改变余额；“历史起点余额”会从这一天开始逐笔加减。四项金额分别表示两个人的流动资金和存款，资金所有人不会随账户保管人改变。</div><p id="accountError" class="form-error"></p><div class="modal-actions">${id?'<button type="button" id="deleteAccount" class="btn danger">删除空账户</button>':''}<button class="btn primary">保存账户</button></div></form>`);const f=$('accountForm');f.onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(f));const opening={a:{},b:{}};for(const o of ['a','b'])for(const b of ['liquid','savings'])opening[o][b]=Number(d[o+'_'+b])===0?0:toCents(d[o+'_'+b]);const v={...a,name:d.name.trim(),holder:d.holder,type:d.type,asOf:d.asOf,balanceBasis:d.balanceBasis||'current',opening};await save('account',a.id,v);closeModal();toast('账户已保存');}catch(e){$('accountError').textContent=e.message;}};if(id)$('deleteAccount').onclick=async()=>{if(Object.values(state.tx).some(t=>[t.account,t.toAccount,t.refundAccount].includes(id))||Object.values(a.opening).some(p=>p.liquid||p.savings)){toast('有余额或历史账单引用的账户不能删除，可修改名称');return;}await save('account',id,{...a,deleted:true});closeModal();};}
function debtForm(id){assertEditable();const d=state.debt[id]||{id:Ledger.uuid(),owner:ownerMode(),name:'',side:'owed',opening:0,asOf:localNow().slice(0,10),counterparty:''};modal('欠款 / 应收',`<form id="debtForm"><div class="form-grid"><label>归属<select name="owner">${ownerOptions(d.owner)}</select></label><label>性质<select name="side">${opt('owed','我欠别人',d.side)+opt('claim','别人欠我',d.side)}</select></label><label>名称<input name="name" required maxlength="100" value="${E(d.name)}" placeholder="例如：花呗、借给朋友"></label><label>对方<input name="counterparty" maxlength="100" value="${E(d.counterparty)}"></label><label>初始未结金额（元）<input name="opening" type="number" min="0" step="0.01" required value="${(d.opening/100).toFixed(2)}"></label><label>起始日期<input type="date" name="asOf" required value="${d.asOf}"></label></div><div class="note">此处填写未结清的债权或欠款，不会增加或减少银行卡余额。之后在“记一笔”中选择借入、借出、还款或收回借款。</div><p class="form-error" id="debtError"></p><div class="modal-actions"><button class="btn primary">保存</button></div></form>`);$('debtForm').onsubmit=async e=>{e.preventDefault();try{const v=Object.fromEntries(new FormData(e.target));await save('debt',d.id,{...d,...v,opening:Number(v.opening)===0?0:toCents(v.opening)});closeModal();}catch(e){$('debtError').textContent=e.message;}};}
function taxonomyForm(type,id){assertEditable();const old=state[type][id],v=old||{id:Ledger.uuid(),name:'',color:mode==='b'?'#c0a6ee':'#96dfbb'};modal((old?'编辑':'添加')+(type==='category'?'分类':'标签'),`<form id="taxForm"><div class="form-grid"><label>名称<input name="name" required maxlength="40" value="${E(v.name)}"></label><label>颜色<input name="color" type="color" value="${v.color}"></label></div><div class="note">删除后无法新选用；历史账单上的名称仍保留，避免丢失原记录。</div><div id="taxError" class="form-error"></div><div class="modal-actions">${old?'<button class="btn danger" id="deleteTax" type="button">删除</button>':''}<button class="btn primary">保存</button></div></form>`);$('taxForm').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));if(active(state[type]).some(t=>t.id!==v.id&&t.name===d.name.trim()))throw Error('这个名称已存在');await save(type,v.id,{...v,name:d.name.trim(),color:d.color});closeModal();}catch(e){$('taxError').textContent=e.message;}};if(old)$('deleteTax').onclick=async()=>{await save(type,id,{...old,deleted:true});closeModal();};}
function showHistory(type,id){const history=data.ops.filter(o=>o.type===type&&o.entity===id).sort((a,b)=>b.at.localeCompare(a.at));modal('修改历史',history.map(o=>`<div class="history-item"><strong>${E(name(o.actor))} · ${E(new Date(o.at).toLocaleString('zh-CN'))}</strong><p>${o.value.deleted?'移入回收站':o.parents.length?'更新记录':'创建记录'}</p><details><summary class="subtle">展开此版本</summary><pre class="raw">${E(JSON.stringify(o.value,null,2))}</pre></details></div>`).join(''));}
function conflictForm(k){assertEditable();const c=state.conflicts.find(c=>c.key===k);if(!c)return;modal('确认使用哪个版本',`<div class="note">选择的版本会成为新版本，所有旧版本仍保留。若需要组合两个版本，可先选择一个，再编辑。</div>${c.heads.map((o,i)=>`<section class="review-card"><h3>${E(name(o.actor))} · ${E(new Date(o.at).toLocaleString('zh-CN'))}</h3><pre class="raw">${E(JSON.stringify(o.value,null,2))}</pre><button class="btn" data-resolve-index="${i}">采用此版本</button></section>`).join('')}`);document.querySelectorAll('[data-resolve-index]').forEach(b=>b.onclick=async()=>{const op=c.heads[+b.dataset.resolveIndex];await save(op.type,op.entity,op.value,c.heads.map(h=>h.id));closeModal();toast('冲突已处理');});}
function pairForm(index){assertEditable();const pair=Ledger.candidates(state)[index];if(!pair)return;const {out,inc}=pair;modal('合并为一笔转账',`<form id="pairForm"><div class="note">${E(aname(out.account))} → ${E(aname(inc.account))} · ¥${money(out.amount)}<br>保留两端原始订单，转入明细作为关联记录，不再重复计算。</div><div class="form-grid"><label>资金原本属于谁<select name="owner">${ownerOptions(out.owner)}</select></label><label>资金用途<select name="purpose">${Object.entries(purposeNames).map(([k,n])=>opt(k,n,out.owner===inc.owner?'internal':'custody')).join('')}</select></label><label>转出部分<select name="bucket">${opt('liquid','流动资金','liquid')+opt('savings','存款','liquid')}</select></label><label>转入部分<select name="toBucket">${opt('liquid','流动资金','liquid')+opt('savings','存款','liquid')}</select></label><label class="full">赠与 / 借还款的接收所有人<select name="toOwner">${ownerOptions(inc.owner)}</select></label><label class="full check-row"><input type="checkbox" name="remember">记住此内部转账规则（只适用于所有权不变）</label></div><p id="pairError" class="form-error"></p><div class="modal-actions"><button class="btn primary">确认合并</button></div></form>`);$('pairForm').onsubmit=async e=>{e.preventDefault();try{const v=Object.fromEntries(new FormData(e.target));await mergePair(out,inc,v,!!v.remember);closeModal();toast('已合并转账，原始记录仍保留');}catch(e){$('pairError').textContent=e.message;}};}
async function mergePair(out,inc,options,remember=false){const owner=options.owner,toOwner=['gift','loan','loan-repay'].includes(options.purpose)?options.toOwner:owner;const main={...out,...options,owner,toOwner,kind:'transfer',toAccount:inc.account,transferInDate:inc.date,amount:out.amount,pending:false,pendingReason:'',pairedId:inc.id,merchant:out.merchant||purposeNames[options.purpose]},leg={...inc,linkedTo:out.id,linkedRole:'transfer-leg',pending:false};const changes=[{type:'tx',id:out.id,value:main},{type:'tx',id:inc.id,value:leg}];if(remember){if(owner!==toOwner)throw Error('赠与和借还款需要逐次确认，不保存自动规则');changes.push({type:'rule',id:Ledger.uuid(),value:{ruleType:'transfer',owner,from:out.account,to:inc.account,outMerchant:out.merchant,inMerchant:inc.merchant,outKind:out.raw?.kind||'',inKind:inc.raw?.kind||'',outSource:out.raw?.source||'',inSource:inc.raw?.source||'',purpose:options.purpose,bucket:options.bucket,toBucket:options.toBucket}});}await saveBatch(changes);}
async function applyAutoRules(){const rules=active(state.rule).filter(r=>r.ruleType==='transfer');let count=0;for(const rule of rules){const pairs=Ledger.candidates(state).filter(p=>p.minutes<=10&&p.out.account===rule.from&&p.inc.account===rule.to&&p.out.owner===rule.owner&&p.out.merchant===rule.outMerchant&&p.inc.merchant===rule.inMerchant&&(p.out.raw?.kind||'')===rule.outKind&&(p.inc.raw?.kind||'')===rule.inKind&&(p.out.raw?.source||'')===(rule.outSource||'')&&(p.inc.raw?.source||'')===(rule.inSource||''));for(const p of pairs){if(pairs.filter(q=>q.out.id===p.out.id||q.inc.id===p.inc.id).length!==1)continue;if(state.tx[p.out.id]?.kind==='transfer'||state.tx[p.inc.id]?.linkedTo)continue;await mergePair(p.out,p.inc,{owner:rule.owner,toOwner:rule.owner,purpose:rule.purpose,bucket:rule.bucket,toBucket:rule.toBucket});count++;}}return count;}
function refundForm(id){assertEditable();const r=state.tx[id];const expenses=active(state.tx).filter(t=>t.kind==='expense'&&t.owner===r.owner&&!t.pending).sort((a,b)=>{const match=t=>r.raw?.originalOrder&&t.raw?.orderId===r.raw.originalOrder?0:t.merchant===r.merchant?1:2;return match(a)-match(b)||b.date.localeCompare(a.date);});modal('关联原消费',`<form id="refundForm"><div class="note">退款 ${E(r.merchant)} · ¥${money(r.amount)}<br>关联后会抵扣原消费月份的支出，资金在退款日期入账。</div><label class="field">对应的原消费<select name="expense" required>${opt('','请选择原消费','')+expenses.map(t=>opt(t.id,`${t.date.slice(0,10)} · ${t.merchant} · ¥${money(t.amount)} · ${t.raw?.orderId||''}`,'')).join('')}</select></label><label class="field" style="margin-top:16px">退款实际入账账户<select name="account" required>${accountOptions(r.account)}</select></label><p id="refundError" class="form-error"></p><div class="modal-actions"><button class="btn primary">确认关联</button></div></form>`);$('refundForm').onsubmit=async e=>{e.preventDefault();try{const v=Object.fromEntries(new FormData(e.target)),t=state.tx[v.expense];if(!t)throw Error('请选择原消费');const total=active(state.tx).filter(x=>x.kind==='refund'&&x.linkedTo===t.id&&x.id!==r.id&&!x.pending).reduce((s,x)=>s+x.amount,0);if(total+r.amount>t.amount)throw Error('退款合计超过原消费，请检查是否重复退款');await save('tx',r.id,{...r,account:v.account,owner:t.owner,bucket:t.bucket,linkedTo:t.id,pending:false});closeModal();toast('退款已关联，不会计作普通收入');}catch(e){$('refundError').textContent=e.message;}};}
function showTrash(){const list=Object.values(state.tx).filter(t=>t.deleted);modal('回收站',list.length?list.map(t=>`<div class="list-row"><div>${E(t.merchant||kindNames[t.kind])}<p>${E(t.date)} · ¥${money(t.amount)}</p></div><button class="btn small" data-restore-tx="${E(t.id)}">恢复</button></div>`).join(''):empty('回收站是空的','删除的账单会保留在这里，不会因重新导入自动复活。'));}
function download(filename,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
async function backup(){assertEditable();download('星账双人备份_'+localNow().slice(0,10)+'.json',JSON.stringify({app:'star-ledger-duo',schema:2,exportedAt:new Date().toISOString(),ops:data.ops},null,2));toast('备份已开始下载，包含所有人账单，请妥善保管');}
async function restore(file){assertEditable();if(!file)return;if(file.size>50*1024*1024)throw Error('备份超过 50 MB，请拆分归档');const v=JSON.parse(await file.text());if(v.app==='star-ledger'&&v.version===1){if(!Array.isArray(v.records))throw Error('旧版备份格式无效');const records=v.records.map(validateRecord);modal('迁移旧版账本',`<form id="migrateForm"><div class="note">读取到 ${records.length} 笔旧版记录。旧版没有账户信息，迁移后先标为待核对，不影响余额。原文件不会改变。</div><label class="field">这些记录属于谁<select name="owner">${ownerOptions(ownerMode())}</select></label><div class="modal-actions"><button class="btn primary">确认迁移</button></div></form>`);$('migrateForm').onsubmit=async e=>{e.preventDefault();const owner=new FormData(e.target).get('owner');const changes=records.filter(r=>!state.tx['v1:'+owner+':'+r.id]).map(r=>({type:'tx',id:'v1:'+owner+':'+r.id,value:{owner,kind:r.type,date:r.date,amount:r.amount,merchant:r.merchant,note:r.note,account:'',bucket:'liquid',category:active(state.category).find(c=>c.name===r.category)?.id||'',tags:[],refund:0,pending:true,pendingReason:'旧版数据缺少资金账户，请补全',raw:{source:r.source,orderId:r.orderId,status:r.status},importKeys:['import:'+`${owner}|${r.source}|order:${r.orderId}|${r.type}`]}}));await saveBatch(changes);closeModal();navigate('review');toast('旧版记录已迁移，原始备份保留');};return;}if(v.app!=='star-ledger-duo'||v.schema!==2)throw Error('这不是星账双人版备份');const merged=Ledger.merge(data.ops,v.ops);for(const op of merged)Ledger.validateEntity(op.type,op.value);confirm('合并恢复备份',`将合并 ${merged.length-data.ops.length} 条新版本记录，已有记录不会被整本覆盖。发生同时修改时需在核对页确认。`,async()=>{data=await Store.append(v.ops);refreshState();render();scheduleSync();toast('备份已合并');});}
function exportCSV(){const rows=ledgerRows();const cell=v=>'"'+String(v??'').replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"';const lines=[['日期','所有人','类型','原金额','净消费金额','交易对方','账户','资金性质','用途','分类','标签','备注','订单号','待核对'],...rows.map(t=>[t.date,name(t.owner),kindNames[t.kind],(t.amount/100).toFixed(2),t.kind==='expense'?(Ledger.netExpense(t,state)/100).toFixed(2):'',t.merchant,aname(t.account),bucketName(t.bucket),purposeNames[t.purpose]||'',state.category[t.category]?.name||'',t.tags.map(id=>state.tag[id]?.name).join(' / '),t.note,t.raw?.orderId||'',t.pending?'是':'否'])];download('星账明细_'+localNow().slice(0,10)+'.csv','\uFEFF'+lines.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function sampleData(){let ops=initOps();const add=(type,id,v)=>{ops.push(Ledger.operation(ops,type,id,v,'a','demo'));};const first=monthNow()+'-01';const account=(name,holder,opening,type='银行卡')=>({name,holder,opening,asOf:first,type});add('profile','a',{name:'青禾'});add('profile','b',{name:'星野'});add('account','demo-bank',account('招商银行 · 1208','a',{a:{liquid:200000,savings:500000},b:{liquid:0,savings:100000}}));add('account','demo-wechat',account('微信余额','a',{a:{liquid:85000,savings:0},b:{liquid:0,savings:0}},'微信余额'));add('account','demo-bank-b',account('建设银行 · 0621','b',{a:{liquid:0,savings:80000},b:{liquid:260000,savings:620000}}));
const tx=(id,day,kind,amount,merchant,category,owner='a',account='demo-wechat',more={})=>add('tx',id,{owner,kind,date:monthNow()+'-'+String(Math.min(day,new Date().getDate())).padStart(2,'0')+' 12:30:00',amount,merchant,category:'cat-'+category,account,bucket:'liquid',tags:['tag-0'],note:'示例记录',pending:false,refund:0,...more});tx('demo1',2,'expense',2850,'瑞幸咖啡',0);tx('demo2',4,'expense',6800,'周末晚餐',0);tx('demo3',6,'expense',600,'上海地铁',2);tx('demo4',8,'expense',12900,'换季衣物',1,'a','demo-bank',{refund:3900,refundDate:monthNow()+'-09 10:00:00'});tx('demo5',10,'income',180000,'实习津贴',9,'a','demo-bank');tx('demo6',11,'transfer',50000,'本月存起来',11,'a','demo-bank',{toAccount:'demo-bank',toOwner:'a',toBucket:'savings',purpose:'deposit'});tx('demo7',12,'expense',4690,'超市采购',3);tx('demo8',14,'expense',8900,'上海书城',5);tx('demo9',16,'expense',4200,'周末电影',4);tx('demo10',7,'expense',8800,'两人的午餐',0,'b','demo-bank-b');tx('demo11',13,'transfer',30000,'存一笔小小的期待',11,'b','demo-bank-b',{toAccount:'demo-bank-b',toOwner:'b',toBucket:'savings',purpose:'deposit'});add('debt','demo-debt',{owner:'a',name:'待还分期',side:'owed',opening:65000,asOf:first,counterparty:'示例'});return {schema:2,ops};}
const actions={
'new-account':()=>accountForm(), 'new-debt':()=>debtForm(), 'sync':()=>doSync(),
'prev-month':()=>changeMonth(-1),'next-month':()=>changeMonth(1),'all-month':()=>{filter.month=month;view='ledger';page=1;render();},
'prev-page':()=>{page--;renderLedger();},'next-page':()=>{page++;renderLedger();},'reset-filter':()=>{filter={search:'',kind:'',category:'',tag:'',month:'',day:'',pending:false};page=1;renderLedger();},
'bulk-confirm-pending':()=>bulkPending('confirm'),'bulk-delete-pending':()=>bulkPending('delete'),
'export-csv':exportCSV,'commit-import':commitImport,'backup':backup,'restore':()=>{$('backupInput').click();},'trash':showTrash,
'exit-demo':async()=>{demo=false;data=await Store.get('ledger')||realData;refreshState();render();},
'lock-sync':async()=>{await Store.lock();render();toast('同步连接已锁定，本地账本仍可使用');},
'disconnect':()=>confirm('断开此设备的同步连接？','仅移除此设备保存的授权和同步状态，本地账本和远端数据保留。',async()=>{await Store.disconnect();connectionInfo=null;syncInfo=null;render();}),
'storage-persist':async()=>{const yes=await navigator.storage?.persist?.();toast(yes?'浏览器已同意保留本地数据，仍请定期备份':'浏览器未授予持久存储，已保存记录未受影响，请定期备份');}
};
function changeMonth(delta){const [y,m]=month.split('-').map(Number),d=new Date(y,m-1+delta,1);month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render();}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;try{if(b.dataset.nav){e.preventDefault();navigate(b.dataset.nav);return;}if(b.dataset.mode){switchMode(b.dataset.mode);return;}if(b.dataset.act){e.preventDefault();const fn=actions[b.dataset.act];if(fn)await fn();return;}if(b.dataset.editTx){if(!state.tx[b.dataset.editTx]){toast('导入预览尚未保存，确认导入后可编辑');return;}txForm(b.dataset.editTx);return;}if(b.dataset.account){accountForm(b.dataset.account);return;}if(b.dataset.debt){debtForm(b.dataset.debt);return;}if(b.dataset.category!==undefined){filter.category=b.dataset.category;filter.month=month;page=1;navigate('ledger');return;}if(b.dataset.taxonomy){taxonomyForm(b.dataset.taxonomy);return;}if(b.dataset.editTax){const [type,id]=b.dataset.editTax.split(':');taxonomyForm(type,id);return;}if(b.dataset.pair!==undefined){pairForm(+b.dataset.pair);return;}if(b.dataset.refund){refundForm(b.dataset.refund);return;}if(b.dataset.conflict){conflictForm(b.dataset.conflict);return;}if(b.dataset.restoreTx){const t=state.tx[b.dataset.restoreTx];await save('tx',t.id,{...t,deleted:false});showTrash();return;}if(b.dataset.deleteRule){const r=state.rule[b.dataset.deleteRule];await save('rule',r.id,{...r,deleted:true});return;}if(b.dataset.unlink){const t=state.tx[b.dataset.unlink],parent=state.tx[t.linkedTo];const changes=[{type:'tx',id:t.id,value:{...t,linkedTo:'',linkedRole:'',pending:true,pendingReason:'已解除转账关联，请重新核对'}}];if(parent)changes.push({type:'tx',id:parent.id,value:{...parent,pending:true,pendingReason:'已解除转账关联，请核对两端记录',pairedId:''}});await saveBatch(changes);closeModal();return;}}catch(err){toast(err.message);}});
document.addEventListener('change',e=>{if(e.target.matches('[data-select-all-pending]'))document.querySelectorAll('[data-select-pending]').forEach(x=>{x.checked=e.target.checked;});});
document.addEventListener('click',e=>{const t=e.target.closest('[data-day]');if(t){filter.day=t.dataset.day;filter.month=month;filter.kind='expense';navigate('ledger');}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.day){e.preventDefault();filter.day=e.target.dataset.day;filter.month=month;filter.kind='expense';navigate('ledger');}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.id==='search'){filter.search=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const pos=e.target.selectionStart;page=1;renderLedger();$('search')?.focus();try{$('search').setSelectionRange(pos,pos);}catch{}},250);}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='monthInput'){month=e.target.value||monthNow();render();}if(id==='periodMode'){periodMode=e.target.value||'month';render();}const fields={kindFilter:'kind',categoryFilter:'category',tagFilter:'tag',ledgerMonth:'month'};if(fields[id]){filter[fields[id]]=e.target.value;filter.day='';page=1;renderLedger();}if(id==='billFile')parseBill(e.target.files[0]).catch(e=>toast(e.message));if(id==='backupInput'){restore(e.target.files[0]).catch(e=>toast('恢复失败：'+e.message));e.target.value='';}});
document.addEventListener('dragover',e=>{if(e.target.closest('#dropzone')){e.preventDefault();}});document.addEventListener('drop',e=>{if(e.target.closest('#dropzone')){e.preventDefault();parseBill(e.dataTransfer.files[0]).catch(e=>toast(e.message));}});
document.addEventListener('submit',async e=>{if(!['profileForm','connectionForm','unlockForm'].includes(e.target.id))return;e.preventDefault();const f=e.target,b=f.querySelector('[type=submit]')||f.querySelector('button'),d=Object.fromEntries(new FormData(f));if(b)b.disabled=true;try{assertEditable();if(f.id==='profileForm'){await saveBatch([{type:'profile',id:'a',value:{name:d.a.trim()}},{type:'profile',id:'b',value:{name:d.b.trim()}}]);actor=d.actor;await Store.set('actor',actor);render();toast('昵称与记录人已保存');}if(f.id==='connectionForm'){await Store.connect({owner:d.owner.trim(),repo:d.repo.trim(),branch:d.branch.trim()},d.token,d.password,!!d.remember);connectionInfo=await Store.get('connection');f.reset();await doSync();render();}if(f.id==='unlockForm'){await Store.unlock(d.password);f.reset();await doSync();render();}}catch(err){toast(err.message);}finally{if(b)b.disabled=false;}});
$('addEntry').onclick=()=>{try{txForm();}catch(e){toast(e.message);}};$('quickTransfer').onclick=()=>{try{txForm(null,{kind:'transfer',purpose:mode==='shared'?'deposit':'internal',toBucket:mode==='shared'?'savings':'liquid'});}catch(e){toast(e.message);}};$('modalClose').onclick=closeModal;$('confirmCancel').onclick=()=>$('confirmModal').close();$('syncBtn').onclick=()=>doSync();$('demoBtn').onclick=()=>{if(!ready){toast('请先允许浏览器本地存储');return;}realData=data;demo=true;data=sampleData();mode='a';month=monthNow();view='overview';render();};
window.addEventListener('online',()=>scheduleSync());document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&!demo&&ready){data=await Store.get('ledger')||data;refreshState();render();scheduleSync();}});
if(typeof BroadcastChannel!=='undefined'){const channel=new BroadcastChannel('star-ledger-duo');channel.onmessage=async()=>{if(!demo&&ready){data=await Store.get('ledger')||data;refreshState();render();}};const originalSave=saveBatch;saveBatch=async(...args)=>{const result=await originalSave(...args);channel.postMessage('changed');return result;};}
if(document.modelContext?.registerTool){const ctl=new AbortController();window.addEventListener('pagehide',()=>ctl.abort(),{once:true});try{Promise.resolve(document.modelContext.registerTool({name:'switch_ledger_mode',title:'切换星账模式',description:'切换到绿色方、紫色方或双方存款视图，不修改账单。',inputSchema:{type:'object',properties:{mode:{type:'string',enum:['a','b','shared']}},required:['mode'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||!['a','b','shared'].includes(input.mode)||Object.keys(input).some(k=>k!=='mode'))throw Error('无效模式');switchMode(input.mode);return {mode,view};}},{signal:ctl.signal})).catch(()=>{});}catch{}}
async function start(){try{await Store.open();device=await Store.get('device');if(!device){device=Ledger.uuid();await Store.set('device',device);}actor=await Store.get('actor')||'a';mode=await Store.get('mode')||'a';data=await Store.append(initOps());connectionInfo=await Store.get('connection');syncInfo=await Store.get('syncState');ready=true;}catch(e){toast(e.message);}render();if(location.protocol==='https:'||location.hostname==='localhost'){try{const reg=await navigator.serviceWorker?.register('./sw.js');if(reg){await navigator.serviceWorker.ready;offlineStatus='离线资源已准备好；未同步数据仍只在本机';if($('offlineState'))$('offlineState').textContent=offlineStatus;}}catch{offlineStatus='离线缓存未成功，请保持联网并重试';if($('offlineState'))$('offlineState').textContent=offlineStatus;}}}
start();

async function commitImport(){if(ioBusy)throw Error("正在处理文件，请稍候");ioBusy=true;try{return await importNow();}finally{ioBusy=false;}}
</script></body></html>
